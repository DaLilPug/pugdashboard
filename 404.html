<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        // Share links: /share/<slug> is a clean public URL with no file
        // behind it on GitHub Pages, so it 404s here. Forward to the share
        // page with the slug as a query param; that page exchanges it for a
        // scoped session and bounces to the account. replace() so Back
        // doesn't loop straight back into this redirect.
        var shareMatch = window.location.pathname.match(/^\/share\/(.+)$/);
        if (shareMatch) {
          var slug = shareMatch[1].replace(/\/+$/, '');
          // Carry the hash: share URLs copied from an open dashboard
          // include the tab (/share/<slug>#responses), and the recipient
          // should land on that same tab.
          window.location.replace('/share/?s=' + encodeURIComponent(slug) + window.location.hash);
          return;
        }
      } catch (e) {}
    })();
  </script>
  <title>Not found - Uptown Tracker</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="login-body">
  <div class="login-card" style="text-align:center;">
    <div class="login-brand" style="justify-content:center;">
      <img src="/assets/logo-tracker-navy.png" alt="Uptown Tracker" />
    </div>
    <div class="login-title">Page not found</div>
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:18px;">
      That page doesn't exist. Head back to the dashboard.
    </p>
    <a href="/dashboard/" class="btn-primary" style="justify-content:center;">Go to dashboard</a>
  </div>
</body>
</html>
