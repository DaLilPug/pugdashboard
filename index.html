<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uptown Tracker</title>
  <!-- Deliberately minimal. This was a full marketing landing page until
       2026-08-15; it was cut back after LinkedIn's compliance change to
       Apollo's extension, because a sales page for a product with no
       external customers is exposure with no upside. The old page is in
       git history (see the commit that replaced it) and can be restored
       verbatim whenever there's a reason to sell publicly again.

       Keep this page free of: volume claims, bulk/saved-search language,
       anything that reads as automating LinkedIn actions. Terms, Privacy
       and Guides are reachable at their own URLs and from inside the app;
       the binding consent line lives on the sign-in button in /login/. -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- Signed-in users skip this page entirely. The check runs in <head>,
       before first paint, so there's no landing-page flash on the way to
       the dashboard - "an annoying extra click every time" (Austin,
       2026-08-27). Share-link sessions are skipped here on purpose:
       loading supabase-client.js brings its shareScopeGuard along, which
       bounces them to their one account page. Anyone signed out just
       sees the static landing as before. -->
  <script src="/config.js"></script>
  <script src="/supabase-client.js"></script>
  <script>
    (function () {
      try {
        var s = sb.getSession();
        var meta = s && s.user && s.user.user_metadata;
        if (s && !(meta && meta.is_share_user)) window.location.replace("/dashboard/");
      } catch (_) { /* no session store - fall through to the landing */ }
    })();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #013A52; --navy-dark: #012a3d; --ink: #22303c; --muted: #5b6b78; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
    }
    img.logo { height: 48px; width: auto; margin-bottom: 32px; }
    a.signin {
      display: inline-block;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 8px;
      transition: background .15s ease;
    }
    a.signin:hover { background: var(--navy-dark); }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    footer .sep { margin: 0 8px; opacity: .5; }
    /* Client notice: same wording as /login/. Clients who were sent this
       address instead of their share link read this before "Sign in". */
    .client-notice {
      max-width: 420px;
      margin-top: 28px;
      text-align: left;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
      background: rgba(1, 58, 82, 0.05);
      border: 1px solid rgba(1, 58, 82, 0.12);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .client-notice strong { display: block; color: var(--navy); margin-bottom: 2px; }
    .client-notice code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      background: #fff;
      border: 1px solid rgba(1, 58, 82, 0.15);
      border-radius: 4px;
      padding: 0 4px;
    }
    .client-notice button {
      background: none; border: 0; padding: 0; margin: 0;
      font: inherit; font-weight: 600; color: var(--navy);
      text-decoration: underline dotted; cursor: pointer;
    }
    .client-notice button:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <img class="logo" src="/assets/logo-tracker-navy.png" alt="Uptown Tracker" />

  <a class="signin" href="/login/">Sign in</a>

  <div class="client-notice">
    <strong>Uptown client looking for your dashboard?</strong>
    Use the shared link your Uptown team sent you. It starts with
    <code>app.uptown.com/share/</code> and needs no password. Questions go to
    your Customer Success Manager at
    <button type="button" data-copy="coach@uptown.com" title="Click to copy">coach@uptown.com</button>
  </div>

  <footer>
    &copy; <span id="year"></span> Uptown Creation, LLC
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // Click-to-copy for the coach@ address (no mailto: links on Uptown properties).
    document.querySelectorAll('.client-notice button[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try { await navigator.clipboard.writeText(btn.dataset.copy); } catch (_) { /* text is visible anyway */ }
        var prev = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = prev; }, 1500);
      });
    });
  </script>

</body>
</html>
